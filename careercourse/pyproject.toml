[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "careercourse"
version = "0.1.0"
description = "Career guidance app matching users to historical figures"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
