<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerCourse - 历史人物职业指导</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            padding: 30px 0;
            font-size: 2.5em;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #a0a0a0;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .question {
            margin-bottom: 30px;
        }
        .question h3 {
            margin-bottom: 15px;
            color: #e94560;
        }
        .option {
            display: block;
            padding: 12px 20px;
            margin: 8px 0;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        .option:hover {
            background: rgba(233, 69, 96, 0.2);
            border-color: #e94560;
        }
        .option.selected {
            background: #e94560;
            color: #fff;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.02);
        }
        .result-card {
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #e94560;
            cursor: pointer;
            transition: all 0.3s;
        }
        .result-card:hover {
            background: rgba(255,255,255,0.12);
            transform: translateX(5px);
        }
        .result-card.expanded {
            border-left-color: #4ecca3;
        }
        .result-card h4 {
            color: #e94560;
            margin-bottom: 10px;
            font-size: 1.2em;
        }
        .result-card .meta {
            font-size: 0.85em;
            color: #a0a0a0;
            margin-bottom: 8px;
        }
        .result-card .similarity {
            font-size: 0.9em;
            color: #4ecca3;
            font-weight: bold;
        }
        .result-card .achievement {
            font-size: 0.9em;
            color: #ddd;
            margin-top: 8px;
        }
        .result-card .detail {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 0.95em;
            line-height: 1.8;
        }
        .result-card.expanded .detail {
            display: block;
        }
        .detail-section {
            margin-bottom: 12px;
        }
        .detail-section strong {
            color: #e94560;
        }
        .hidden { display: none; }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: #a0a0a0;
        }
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #e94560;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            transition: width 0.3s;
        }
        .click-hint {
            text-align: center;
            color: #666;
            font-size: 0.85em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 CareerCourse</h1>
        <p class="subtitle">了解历史成功人士早期的奋斗经历，获取可执行建议</p>

        <!-- 开始页面 -->
        <div id="start-page" class="card">
            <h2 style="text-align:center; margin-bottom:20px;">开始职业探索</h2>
            <p style="text-align:center; color:#a0a0a0; margin-bottom:30px;">
                完成20道情境选择题，系统将根据你的职业阶段、性格特点与100位历史成功人士进行匹配，<br>
                展示他们早期经历的相似之处与可执行建议。
            </p>
            <button class="btn" onclick="startQuiz()">开始测试</button>
        </div>

        <!-- 答题页面 -->
        <div id="quiz-page" class="hidden">
            <div class="progress-bar">
                <div class="progress-fill" id="progress" style="width: 5%"></div>
            </div>
            <div class="card">
                <h2 id="question-title" style="margin-bottom:20px; color:#e94560;"></h2>
                <div id="options-container"></div>
            </div>
        </div>

        <!-- 加载页面 -->
        <div id="loading-page" class="hidden">
            <div class="card">
                <div class="loading">正在分析你的职业轨迹...</div>
            </div>
        </div>

        <!-- 结果页面 -->
        <div id="result-page" class="hidden">
            <h2 style="text-align:center; margin-bottom:20px;">你的历史人物匹配</h2>
            <p class="click-hint">点击卡片查看详细介绍</p>
            <div id="results-container"></div>
            <button class="btn" onclick="resetQuiz()" style="margin-top:20px;">重新测试</button>
        </div>
    </div>

    <script>
        let questions = [];
        let currentQuestion = 0;
        let answers = [];

        async function startQuiz() {
            try {
                const res = await fetch('/api/questions');
                const data = await res.json();
                questions = data.questions;
                document.getElementById('start-page').classList.add('hidden');
                document.getElementById('quiz-page').classList.remove('hidden');
                renderQuestion();
            } catch(e) {
                alert('加载题目失败');
            }
        }

        function renderQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-title').textContent = `${currentQuestion + 1}/${questions.length}: ${q.question}`;
            document.getElementById('progress').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.textContent = opt.text;
                div.onclick = () => selectOption(idx);
                container.appendChild(div);
            });
        }

        function selectOption(idx) {
            document.querySelectorAll('.option').forEach((el, i) => {
                el.classList.toggle('selected', i === idx);
            });
            answers[currentQuestion] = {
                question_id: questions[currentQuestion].id,
                option_index: idx
            };
            
            // Auto-advance to next question
            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion >= questions.length) {
                    submitAnswers();
                } else {
                    renderQuestion();
                }
            }, 300);
        }

        async function submitAnswers() {
            console.log('=== submitAnswers START ===');
            console.log('answers length:', answers.length);
            console.log('answers:', JSON.stringify(answers));
            console.log('questions length:', questions.length);
            console.log('currentQuestion:', currentQuestion);
            
            // Ensure all 20 questions have answers
            while (answers.length < 20) {
                answers.push({question_id: answers.length + 1, option_index: 0});
            }
            console.log('answers after padding:', answers.length);
            
            document.getElementById('quiz-page').classList.add('hidden');
            document.getElementById('loading-page').classList.remove('hidden');

            try {
                console.log('Fetching /api/match...');
                const body = JSON.stringify({ answers, top_n: 10 });
                console.log('Request body:', body);
                
                const res = await fetch('/api/match', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: body
                });
                console.log('Fetch response status:', res.status);
                console.log('Fetch response OK:', res.ok);
                
                const text = await res.text();
                console.log('Response text:', text.substring(0, 500));
                
                const data = JSON.parse(text);
                console.log('Parsed data keys:', Object.keys(data));
                console.log('data.matches exists:', 'matches' in data);
                console.log('data.matches length:', data.matches ? data.matches.length : 'N/A');
                
                // If match fails (no results), go back to start
                if (!data.matches || data.matches.length === 0) {
                    console.log('匹配失败，返回开始页面');
                    console.log('  - data.matches:', data.matches);
                    resetQuiz();
                    return;
                }
                
                console.log('Calling renderResults with', data.matches.length, 'matches');
                console.log('First match:', data.matches[0].figure.name_cn);
                renderResults(data.matches);
                console.log('=== submitAnswers END (success) ===');
            } catch(e) {
                console.error('=== submitAnswers ERROR ===');
                console.error('Error type:', e.constructor.name);
                console.error('Error message:', e.message);
                console.error('Error stack:', e.stack);
                // On error, go back to start
                resetQuiz();
            }
        }

        function renderResults(matches) {
            document.getElementById('loading-page').classList.add('hidden');
            document.getElementById('result-page').classList.remove('hidden');

            const container = document.getElementById('results-container');
            container.innerHTML = '';

            matches.forEach((match, idx) => {
                const fig = match.figure;
                const sug = match.suggestion;
                
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <h4>${idx + 1}. ${fig.name_cn}</h4>
                    <div class="meta">${fig.era} · ${fig.type}</div>
                    <div class="similarity">相似度: ${(match.similarity * 100).toFixed(1)}%</div>
                    <div class="achievement">🏆 ${fig.breakthrough}</div>
                    <div class="detail">
                        <div class="detail-section">
                            <strong>早期经历:</strong> ${sug.early_career}
                        </div>
                        <div class="detail-section">
                            <strong>关键行动:</strong> ${sug.early_actions}
                        </div>
                        <div class="detail-section">
                            <strong>核心成就:</strong> ${sug.breakthrough}
                        </div>
                        <div class="detail-section">
                            <strong>人生教训:</strong> ${sug.key_lesson}
                        </div>
                        ${sug.gaps && sug.gaps.length > 0 ? `
                        <div class="detail-section">
                            <strong>成长建议:</strong><br>
                            ${sug.gaps.slice(0, 3).map(g => `· ${getTraitName(g.dimension)}: ${g.direction === 'develop' ? '需要提升' : '保持现状'}`).join('<br>')}
                        </div>
                        ` : ''}
                    </div>
                `;
                card.onclick = () => card.classList.toggle('expanded');
                container.appendChild(card);
            });
        }

        function getTraitName(dim) {
            const names = {
                'openness': '开放性',
                'conscientiousness': '尽责性',
                'extraversion': '外向性',
                'agreeableness': '宜人性',
                'neuroticism': '情绪稳定性',
                'leadership': '领导力',
                'risk_taking': '风险承受',
                'rationality': '理性度',
                'discipline': '自律性',
                'empathy': '共情力',
                'ambition': '野心',
                'resilience': '韧性'
            };
            return names[dim] || dim;
        }

        function resetQuiz() {
            currentQuestion = 0;
            answers = [];
            document.getElementById('result-page').classList.add('hidden');
            document.getElementById('loading-page').classList.add('hidden');
            document.getElementById('start-page').classList.remove('hidden');
        }
    </script>
</body>
</html>
