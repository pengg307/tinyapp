<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>GenProphets - 职业性格测试</title>
<style>
:root{
  --bg: linear-gradient(160deg,#0f0c29,#302b63,#24243e);
  --card: rgba(255,255,255,0.08);
  --accent: linear-gradient(135deg,#e94560,#ff6b6b);
  --text:#f2f2f2;
  --muted:#a8b0c8;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans SC","WenQuanYi Micro Hei","Segoe UI",sans-serif;
  background:var(--bg); color:var(--text);
  -webkit-tap-highlight-color:transparent;
}

.container{
  max-width:480px;
  margin:0 auto;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  position:relative;
}

/* Screen management - ONLY ONE VISIBLE AT A TIME */
.screen{
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  display:none;
  flex-direction:column;
  overflow:hidden;
}
.screen.active{
  display:flex;
}

/* ===== 开始页 ===== */
#start-screen{
  justify-content:center;
  align-items:center;
  padding:2rem;
  text-align:center;
}
#start-screen h1{
  font-size:2.2rem;
  background:linear-gradient(135deg,#e94560,#ffd166);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:.5rem;
}
#start-screen .subtitle{color:var(--muted);font-size:.95rem;}
#start-screen p{
  margin-top:1rem;
  color:var(--muted);
  font-size:.9rem;
  line-height:1.6;
  max-width:340px;
}
.btn{
  padding:.9rem 2.5rem;
  border:none;
  border-radius:50px;
  background:var(--accent);
  color:#fff;
  font-weight:900;
  font-size:1rem;
  cursor:pointer;
  box-shadow:0 4px 16px rgba(233,69,96,.4);
  transition:all .2s;
  margin-top:2rem;
}
.btn:active{transform:scale(0.95);}

/* ===== 答题页 ===== */
#quiz-screen{padding:1rem;}
.quiz-card{
  background:var(--card);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:1.2rem;
  padding:1.5rem;
  flex:1;
  display:flex;
  flex-direction:column;
}
.quiz-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:.8rem;
}
.quiz-header h3{font-size:.95rem;font-weight:500;}
.dim-badge{
  background:rgba(233,69,96,0.2);
  color:#ff6b6b;
  padding:.2rem .6rem;
  border-radius:20px;
  font-size:.75rem;
  font-weight:700;
}
.progress-wrap{
  width:100%;
  height:6px;
  background:rgba(255,255,255,0.1);
  border-radius:3px;
  margin-bottom:1.5rem;
}
.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#e94560,#ffd166);
  border-radius:3px;
  transition:width .4s ease;
}
#q-text{
  font-size:1.1rem;
  font-weight:700;
  margin-bottom:1.2rem;
  line-height:1.5;
  flex:1;
}
.option-btn{
  display:block;
  width:100%;
  text-align:left;
  padding:1rem;
  margin:.4rem 0;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:.8rem;
  color:var(--text);
  font-size:.95rem;
  cursor:pointer;
  transition:all .2s;
}
.option-btn:active{
  background:rgba(233,69,96,0.2);
  border-color:#e94560;
}

/* ===== 加载页 ===== */
#loading-screen{
  justify-content:center;
  align-items:center;
  padding:2rem;
  text-align:center;
}
#loading-screen h2{font-size:1.3rem;margin-bottom:.5rem;}
#loading-screen p{color:var(--muted);font-size:.9rem;}
.spinner{
  width:50px;height:50px;
  border:4px solid rgba(255,255,255,0.1);
  border-top-color:#e94560;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:2rem auto 0;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ===== 结果页 ===== */
#result-screen{
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.result-inner{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:1rem;
  gap:1rem;
}

/* Hero */
.hero-card{
  background:var(--card);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:1.2rem;
  overflow:hidden;
}
.hero-visual{
  height:160px;
  background:linear-gradient(135deg,#2d1b4e,#0f3460);
  display:flex;
  align-items:center;
  padding:1.2rem;
}
.hero-avatar{
  width:60px;height:60px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,0.3);
  background:linear-gradient(135deg,#e94560,#ff6b6b);
  display:grid;place-items:center;
  font-size:1.8rem;font-weight:900;color:#fff;
  margin-right:1rem;
  flex-shrink:0;
}
.hero-text h2{font-size:1.2rem;margin-bottom:.2rem;}
.hero-text p{color:var(--muted);font-size:.75rem;}
.sim-badge{
  display:inline-block;
  background:rgba(233,69,96,0.3);
  color:#ff6b6b;
  padding:.15rem .5rem;
  border-radius:20px;
  font-size:.75rem;
  font-weight:700;
  margin-top:.3rem;
}
.radar-wrap{
  padding:1rem;
  display:flex;
  justify-content:center;
}
#radar-canvas{
  max-width:260px;
  max-height:260px;
}

/* Selector */
.selector-section{
  background:var(--card);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:1rem;
  padding:.8rem;
}
.selector-section h3{
  font-size:.85rem;
  color:var(--muted);
  margin-bottom:.6rem;
  padding-left:.4rem;
  border-left:3px solid #e94560;
}
.selector-list{
  display:flex;
  flex-direction:column;
  gap:.4rem;
  max-height:180px;
  overflow-y:auto;
}
.selector-item{
  display:flex;
  align-items:center;
  gap:.6rem;
  padding:.6rem .7rem;
  border-radius:.7rem;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.06);
  cursor:pointer;
  transition:all .2s;
}
.selector-item:active{background:rgba(233,69,96,0.15);}
.selector-item.active{
  background:rgba(233,69,96,0.18);
  border-color:#e94560;
}
.selector-thumb{
  width:32px;height:32px;
  border-radius:50%;
  background:linear-gradient(135deg,#e94560,#7b2cbf);
  display:grid;place-items:center;
  font-weight:900;font-size:.85rem;
  flex-shrink:0;
}
.selector-info{flex:1;min-width:0;}
.selector-info .name{font-weight:700;font-size:.88rem;}
.selector-info .meta{font-size:.7rem;color:var(--muted);}
.selector-sim{font-weight:900;color:#ff6b6b;font-size:.8rem;}

/* Detail */
.detail-section{
  display:flex;
  flex-direction:column;
  gap:.6rem;
}
.detail-card{
  background:var(--card);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:1rem;
  padding:.9rem;
}
.detail-card h3{
  font-size:.9rem;
  border-left:3px solid #e94560;
  padding-left:.4rem;
  margin-bottom:.4rem;
  font-family:"Noto Serif SC","SimSun",serif;
}
.detail-card p{
  font-size:.82rem;
  line-height:1.6;
  color:#d0d4e8;
}
.gap-table{
  width:100%;
  border-collapse:collapse;
  font-size:.75rem;
}
.gap-table th{
  text-align:left;
  padding:.3rem;
  background:rgba(255,255,255,0.05);
  color:var(--muted);
  font-weight:500;
}
.gap-table td{
  padding:.3rem;
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.gap-table .direction{color:#ff6b6b;font-weight:700;}
.overall-text{color:#ff6b6b;font-weight:700;font-size:.88rem;}

/* Bottom button */
.bottom-bar{
  padding:.8rem 1rem;
  border-top:1px solid rgba(255,255,255,0.06);
  background:rgba(0,0,0,0.2);
}
.btn-full{
  width:100%;
  padding:.9rem;
  border:none;
  border-radius:50px;
  background:var(--accent);
  color:#fff;
  font-weight:900;
  font-size:1rem;
  cursor:pointer;
}

/* Desktop */
@media(min-width:768px){
  .container{max-width:600px;}
  .hero-visual{height:180px;}
  .hero-avatar{width:70px;height:70px;font-size:2rem;}
  #radar-canvas{max-width:280px;max-height:280px;}
  .selector-list{max-height:220px;}
}
@media(min-width:1024px){
  .container{
    max-width:1200px;
    display:flex;
    flex-direction:row;
    gap:1.5rem;
    padding:1.5rem;
  }
  #result-screen{overflow:visible;}
  .result-inner{
    flex-direction:row;
    flex:1;
    gap:1.5rem;
  }
  .hero-card{flex:1;min-width:0;}
  .selector-section{flex:1;min-width:0;}
  .detail-section{flex:1.2;min-width:0;}
  .hero-visual{height:240px;}
  .hero-avatar{width:90px;height:90px;font-size:2.5rem;}
  .selector-list{max-height:none;}
  .bottom-bar{display:none;}
}
</style>
</head>
<body>

<div class="container">

  <!-- 开始 -->
  <section id="start-screen" class="screen active">
    <h1>GenProphets</h1>
    <p class="subtitle">职业性格测试 · 与 100 位历史人物匹配</p>
    <p>回答 60 道问题，测量你的 12 维职业性格特质，发现最相似的历史人物与成长建议。</p>
    <button class="btn" onclick="startQuiz()">开始测试</button>
  </section>

  <!-- 答题 -->
  <section id="quiz-screen" class="screen">
    <div class="quiz-card">
      <div class="quiz-header">
        <h3>第 <span id="q-num">1</span> / <span id="q-total">60</span> 题</h3>
        <span class="dim-badge" id="q-dim">openness</span>
      </div>
      <div class="progress-wrap"><div class="progress-fill" id="progress-fill"></div></div>
      <h2 id="q-text">问题内容...</h2>
      <div id="options-area"></div>
    </div>
  </section>

  <!-- 加载 -->
  <section id="loading-screen" class="screen">
    <div>
      <h2>正在分析你的职业性格...</h2>
      <p>基于 12 维向量与 100 位历史人物进行相似度计算</p>
      <div class="spinner"></div>
    </div>
  </section>

  <!-- 结果 -->
  <section id="result-screen" class="screen">
    <div class="result-inner">
      <!-- 左侧：Hero + 雷达 + 列表 -->
      <div class="left-panel">
        <div class="hero-card">
          <div class="hero-visual">
            <div class="hero-avatar" id="hero-avatar">?</div>
            <div class="hero-text">
              <h2 id="hero-name">请选择人物</h2>
              <p id="hero-sub">点击列表查看详情</p>
              <span class="sim-badge" id="hero-sim">0%</span>
            </div>
          </div>
          <div class="radar-wrap">
            <canvas id="radar-canvas" width="260" height="260"></canvas>
          </div>
        </div>
        
        <div class="selector-section">
          <h3>TOP 匹配人物</h3>
          <div class="selector-list" id="selector-list"></div>
        </div>
      </div>

      <!-- 右侧：详情 -->
      <div class="detail-section" id="detail-section">
        <div class="detail-card">
          <h3>早期经历</h3>
          <p id="r-early">—</p>
        </div>
        <div class="detail-card">
          <h3>关键行动</h3>
          <p id="r-actions">—</p>
        </div>
        <div class="detail-card">
          <h3>核心成就</h3>
          <p id="r-break">—</p>
        </div>
        <div class="detail-card">
          <h3>人生教训</h3>
          <p id="r-lesson">—</p>
        </div>
        <div class="detail-card">
          <h3>特质差距</h3>
          <table class="gap-table" id="r-gaps">
            <thead><tr><th>维度</th><th>你</th><th>他</th><th>方向</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="detail-card">
          <h3>整体评价</h3>
          <p class="overall-text" id="r-overall">—</p>
        </div>
      </div>
    </div>
    
    <div class="bottom-bar">
      <button class="btn-full" onclick="resetAll()">重新测试</button>
    </div>
  </section>

</div>

<script>
const DIMENSIONS = ['openness','conscientiousness','extraversion','agreeableness','neuroticism','leadership','risk_taking','rationality','discipline','empathy','ambition','resilience'];
const DIM_NAMES = ['开放','尽责','外向','亲和','情绪稳定','领导力','冒险','理性','自律','共情','进取','坚韧'];
let questions = [];
let current = 0;
let answers = [];
let currentData = null;

// ===== 雷达图 =====
const canvas = document.getElementById('radar-canvas');
const ctx = canvas.getContext('2d');
const SIZE = 260;
const CX = SIZE/2;
const CY = SIZE/2;
const R = SIZE/2 - 35;

function drawRadar(userVals, figVals){
  ctx.clearRect(0,0,SIZE,SIZE);
  const n = DIMENSIONS.length;
  const angleStep = (Math.PI*2)/n;
  const startAngle = -Math.PI/2;
  
  // 网格
  for(let level=1; level<=5; level++){
    const lr = R * level/5;
    ctx.beginPath();
    for(let i=0; i<=n; i++){
      const angle = startAngle + angleStep*i;
      const x = CX + lr*Math.cos(angle);
      const y = CY + lr*Math.sin(angle);
      if(i===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  
  // 轴线
  for(let i=0; i<n; i++){
    const angle = startAngle + angleStep*i;
    ctx.beginPath();
    ctx.moveTo(CX,CY);
    ctx.lineTo(CX+R*Math.cos(angle), CY+R*Math.sin(angle));
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.stroke();
  }
  
  // 用户数据（蓝色）
  ctx.beginPath();
  for(let i=0; i<=n; i++){
    const idx = i%n;
    const angle = startAngle + angleStep*idx;
    const val = (userVals[idx]||0) * R;
    const x = CX + val*Math.cos(angle);
    const y = CY + val*Math.sin(angle);
    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.fillStyle = 'rgba(100,180,255,0.25)';
  ctx.fill();
  ctx.strokeStyle = '#64b4ff';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // 人物数据（红色）
  ctx.beginPath();
  for(let i=0; i<=n; i++){
    const idx = i%n;
    const angle = startAngle + angleStep*idx;
    const val = (figVals[idx]||0) * R;
    const x = CX + val*Math.cos(angle);
    const y = CY + val*Math.sin(angle);
    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.fillStyle = 'rgba(233,69,96,0.2)';
  ctx.fill();
  ctx.strokeStyle = '#e94560';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // 标签
  ctx.fillStyle = '#a8b0c8';
  ctx.font = '10px Microsoft YaHei, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(let i=0; i<n; i++){
    const angle = startAngle + angleStep*i;
    const labelR = R + 18;
    const x = CX + labelR*Math.cos(angle);
    const y = CY + labelR*Math.sin(angle);
    ctx.fillText(DIM_NAMES[i], x, y);
  }
  
  // 图例
  ctx.font = '10px Microsoft YaHei, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#64b4ff';
  ctx.fillRect(10, SIZE-22, 10, 10);
  ctx.fillText('你', 24, SIZE-15);
  ctx.fillStyle = '#e94560';
  ctx.fillRect(50, SIZE-22, 10, 10);
  ctx.fillText('人物', 64, SIZE-15);
}

// ===== 页面切换 =====
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

async function loadQuestions(){
  try{
    const r = await fetch('/api/questions');
    const d = await r.json();
    questions = d.questions || [];
    document.getElementById('q-total').textContent = questions.length;
  }catch(e){
    alert('无法加载题目');
  }
}

function startQuiz(){
  answers = [];
  current = 0;
  showScreen('quiz-screen');
  loadQuestions().then(()=>showQuestion());
}

function showQuestion(){
  if(current >= questions.length){
    submitAnswers();
    return;
  }
  const q = questions[current];
  document.getElementById('q-num').textContent = current+1;
  document.getElementById('q-dim').textContent = q.dimension || '维度';
  document.getElementById('q-text').textContent = q.question;
  document.getElementById('progress-fill').style.width = ((current+1)/questions.length*100)+'%';

  const area = document.getElementById('options-area');
  area.innerHTML = '';
  (q.options||[]).forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt.text;
    btn.onclick = ()=>{
      answers.push({question_id: q.id, option_index: idx});
      current++;
      setTimeout(showQuestion, 150);
    };
    area.appendChild(btn);
  });
}

async function submitAnswers(){
  showScreen('loading-screen');
  try{
    const r = await fetch('/api/match', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({answers, top_n:10})
    });
    const data = await r.json();
    currentData = data;
    renderResults(data);
    showScreen('result-screen');
  }catch(e){
    alert('匹配失败');
    showScreen('start-screen');
  }
}

function renderResults(data){
  const matches = (data.matches || []).slice(0,10);
  const list = document.getElementById('selector-list');
  list.innerHTML = '';

  matches.forEach((m, idx)=>{
    const fig = m.figure || {};
    const s = m.suggestion || {};
    const item = document.createElement('div');
    item.className = 'selector-item' + (idx===0 ? ' active' : '');
    item.innerHTML = `
      <div class="selector-thumb">${(fig.name_cn||fig.name||'?').charAt(0)}</div>
      <div class="selector-info">
        <div class="name">${s.figure_name || fig.name_cn || '未知'}</div>
        <div class="meta">${fig.name||''} · ${fig.era||''}</div>
      </div>
      <div class="selector-sim">${(m.similarity*100).toFixed(0)}%</div>
    `;
    item.onclick = ()=>{
      document.querySelectorAll('.selector-item').forEach(x=>x.classList.remove('active'));
      item.classList.add('active');
      showDetail(m);
    };
    list.appendChild(item);
  });

  if(matches.length > 0){
    showDetail(matches[0]);
  }
}

function showDetail(m){
  const fig = m.figure || {};
  const s = m.suggestion || {};
  
  document.getElementById('hero-avatar').textContent = (fig.name_cn||fig.name||'?').charAt(0);
  document.getElementById('hero-name').textContent = s.figure_name || fig.name_cn || '人物';
  document.getElementById('hero-sub').textContent = `${fig.name||''} · ${fig.era||''} · ${fig.type||''}`;
  document.getElementById('hero-sim').textContent = `${(m.similarity*100).toFixed(0)}%`;
  
  document.getElementById('r-early').textContent = s.early_career || fig.early_career || '—';
  document.getElementById('r-actions').textContent = s.early_actions || fig.early_actions || '—';
  document.getElementById('r-break').textContent = s.breakthrough || fig.breakthrough || '—';
  document.getElementById('r-lesson').textContent = s.key_lesson || fig.key_lesson || '—';
  document.getElementById('r-overall').textContent = s.overall || '—';
  
  const tbody = document.querySelector('#r-gaps tbody');
  tbody.innerHTML = '';
  (s.gaps||[]).forEach(g=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${g.dimension}</td><td>${g.user_value}</td><td>${g.figure_value}</td><td class="direction">${g.direction}</td>`;
    tbody.appendChild(tr);
  });
  
  const radar = s.radar || {};
  if(radar.dimensions && radar.user && radar.figure){
    drawRadar(radar.user, radar.figure);
  }
}

function resetAll(){
  current = 0; answers = []; currentData = null;
  showScreen('start-screen');
  document.getElementById('selector-list').innerHTML = '';
  ctx.clearRect(0,0,SIZE,SIZE);
}

// 初始化
showScreen('start-screen');
</script>

</body>
</html>
